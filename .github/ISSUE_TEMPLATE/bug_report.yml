name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the JSON `status` / `errors` it printed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `radar capabilities` -> data.version, or the commit hash
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12
  - type: markdown
    attributes:
      value: Please remove API keys, private endpoints and personal paths before posting.
