[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "zh-community-radar"
version = "0.3.0.dev0"
description = "Evidence-first radar for tech community discussions, including Chinese-language forums"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "boowenchen" }]
keywords = ["community", "radar", "hacker-news", "ptt", "v2ex", "rss", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Natural Language :: Chinese (Traditional)",
  "Natural Language :: English",
]
dependencies = [
  "httpx>=0.28,<0.29", "feedparser>=6.0,<7", "beautifulsoup4>=4.13,<5",
  "portalocker>=3,<4", "psutil>=7,<8", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pip-audit>=2,<3"]

[project.urls]
Homepage = "https://github.com/boowenchen/zh-community-radar"
Issues = "https://github.com/boowenchen/zh-community-radar/issues"

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
